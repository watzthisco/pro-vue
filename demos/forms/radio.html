<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forms: Radio Buttons</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.js"></script>
  </head>
  <body class="p-4">
    <div id="app" class="container" style="max-width: 640px">
      <h1 class="h3 mb-4">Radio buttons and v-model</h1>

      <!-- 1. Radio buttons sharing one v-model form a group; the ref holds the value -->
      <h2 class="h5">Size</h2>
      <div v-for="s in ['small', 'medium', 'large']" :key="s" class="form-check form-check-inline">
        <input class="form-check-input" type="radio" :id="s" :value="s" v-model="size" />
        <label class="form-check-label" :for="s">{{ s }}</label>
      </div>
      <p class="mt-2">size: <code>{{ size }}</code></p>

      <!-- 2. :value can be an object, so the ref holds the whole object -->
      <h2 class="h5 mt-4">Shipping</h2>
      <div v-for="option in shippingOptions" :key="option.id" class="form-check">
        <input class="form-check-input" type="radio" :id="option.id" :value="option" v-model="shipping" />
        <label class="form-check-label" :for="option.id">{{ option.label }} (${{ option.price }})</label>
      </div>
      <p class="mt-2">shipping: <code>{{ shipping }}</code></p>
      <p><strong>Total: ${{ total }}</strong></p>
    </div>

    <script>
      const { createApp, ref, computed } = Vue;

      createApp({
        setup() {
          const size = ref('medium');

          const shippingOptions = [
            { id: 'standard', label: 'Standard', price: 5 },
            { id: 'express', label: 'Express', price: 15 },
            { id: 'overnight', label: 'Overnight', price: 30 },
          ];
          const shipping = ref(shippingOptions[0]);

          const basePrice = { small: 20, medium: 25, large: 30 };
          const total = computed(() => basePrice[size.value] + shipping.value.price);

          return { size, shippingOptions, shipping, total };
        },
      }).mount('#app');
    </script>
  </body>
</html>
