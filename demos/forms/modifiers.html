<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forms: v-model Modifiers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.js"></script>
  </head>
  <body class="p-4">
    <div id="app" class="container" style="max-width: 640px">
      <h1 class="h3 mb-4">v-model modifiers</h1>

      <!-- .lazy: update on "change" (blur / Enter) instead of every keystroke -->
      <label class="form-label">.lazy</label>
      <input class="form-control" v-model.lazy="message" placeholder="type, then press Tab" />
      <p class="mt-1">message: <code>{{ message }}</code></p>

      <!-- .number: cast the input to a number.
           (Vue applies .number automatically to type="number" inputs,
           so these use text inputs to show the difference.) -->
      <div class="row mt-4">
        <div class="col">
          <label class="form-label">plain v-model</label>
          <input class="form-control" inputmode="numeric" v-model="ageText" />
          <p class="mt-1">typeof: <code>{{ typeof ageText }}</code>, plus one: <code>{{ ageText + 1 }}</code></p>
        </div>
        <div class="col">
          <label class="form-label">v-model.number</label>
          <input class="form-control" inputmode="numeric" v-model.number="age" />
          <p class="mt-1">typeof: <code>{{ typeof age }}</code>, plus one: <code>{{ age + 1 }}</code></p>
        </div>
      </div>

      <!-- .trim: strip leading and trailing whitespace -->
      <label class="form-label mt-4">.trim</label>
      <input class="form-control" v-model.trim="username" placeholder="  type with spaces  " />
      <p class="mt-1">username: <code>[{{ username }}]</code></p>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const message = ref('');
          const ageText = ref('20');
          const age = ref(20);
          const username = ref('');

          return { message, ageText, age, username };
        },
      }).mount('#app');
    </script>
  </body>
</html>
