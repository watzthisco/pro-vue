<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forms: Checkboxes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.js"></script>
  </head>
  <body class="p-4">
    <div id="app" class="container" style="max-width: 640px">
      <h1 class="h3 mb-4">Checkboxes and v-model</h1>

      <!-- 1. A single checkbox is bound to a boolean -->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agree" v-model="agree" />
        <label class="form-check-label" for="agree">I agree to the terms</label>
      </div>
      <p>agree: <code>{{ agree }}</code></p>

      <!-- 2. Several checkboxes bound to the same array -->
      <h2 class="h5 mt-4">Which frameworks have you used?</h2>
      <div v-for="fw in options" :key="fw" class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" :id="fw" :value="fw" v-model="frameworks" />
        <label class="form-check-label" :for="fw">{{ fw }}</label>
      </div>
      <p class="mt-2">frameworks: <code>{{ frameworks }}</code></p>

      <!-- 3. true-value / false-value write something other than true/false -->
      <div class="form-check mt-4">
        <input class="form-check-input" type="checkbox" id="news" v-model="newsletter" true-value="yes" false-value="no" />
        <label class="form-check-label" for="news">Send me the newsletter</label>
      </div>
      <p>newsletter: <code>{{ newsletter }}</code></p>

      <button class="btn btn-primary" :disabled="!agree">Submit</button>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const agree = ref(false);
          const options = ['Vue', 'React', 'Angular', 'Svelte'];
          const frameworks = ref([]); // checked values are pushed and removed here
          const newsletter = ref('no');

          return { agree, options, frameworks, newsletter };
        },
      }).mount('#app');
    </script>
  </body>
</html>
