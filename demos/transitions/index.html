<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transitions Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" />
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.js"></script>
    <style>
      /* 1. <transition name="fade">: try changing 0.3s to 2s to watch the classes in DevTools */
      .fade-enter-active,
      .fade-leave-active {
        transition: all 0.3s ease;
      }
      .fade-enter-from,
      .fade-leave-to {
        transform: translateX(10px);
        opacity: 0;
      }

      /* 2. <TransitionGroup name="list"> */
      .list-enter-active,
      .list-leave-active {
        transition: all 0.4s ease;
      }
      .list-enter-from,
      .list-leave-to {
        opacity: 0;
        transform: translateX(30px);
      }
      .list-move {
        transition: transform 0.4s ease; /* the others slide into place */
      }
      .list-leave-active {
        position: absolute; /* take leaving items out of the flow so -move works */
        width: 100%;
      }
      .list-container {
        position: relative;
      }
    </style>
  </head>
  <body class="p-4">
    <div id="app" class="container" style="max-width: 640px">
      <h1 class="h3 mb-4">Transitions</h1>

      <h2 class="h5">1. &lt;Transition&gt; with CSS</h2>
      <button class="btn btn-primary mb-2" @click="show = !show">Toggle</button>
      <transition name="fade">
        <p v-if="show" class="alert alert-success">hello</p>
      </transition>

      <h2 class="h5 mt-4">2. &lt;TransitionGroup&gt; for a list</h2>
      <button class="btn btn-outline-primary btn-sm mb-2" @click="add">Add article</button>
      <transition-group name="list" tag="ul" class="list-group list-container">
        <li v-for="a in articles" :key="a.id" class="list-group-item d-flex justify-content-between">
          {{ a.title }}
          <button class="btn btn-sm btn-outline-danger" @click="remove(a.id)" title="Remove from feed">✕</button>
        </li>
      </transition-group>

      <h2 class="h5 mt-4">3. Custom classes with Animate.css</h2>
      <button class="btn btn-primary mb-2" @click="show2 = !show2">Toggle</button>
      <transition
        enter-active-class="animate__animated animate__tada"
        leave-active-class="animate__animated animate__bounceOutRight"
      >
        <p v-if="show2" class="alert alert-info">hello</p>
      </transition>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const show = ref(true);
          const show2 = ref(true);

          let nextId = 4;
          const articles = ref([
            { id: 1, title: 'How to build webapps that scale' },
            { id: 2, title: 'Welcome to RealWorld' },
            { id: 3, title: 'Vue 3 transitions explained' },
          ]);

          function add() {
            // insert at a random position so you can see -move in action
            const at = Math.floor(Math.random() * (articles.value.length + 1));
            articles.value.splice(at, 0, { id: nextId, title: `New article #${nextId++}` });
          }

          function remove(id) {
            articles.value = articles.value.filter((a) => a.id !== id);
          }

          return { show, show2, articles, add, remove };
        },
      }).mount('#app');
    </script>
  </body>
</html>
