<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hello Vue</title>
    <script src="https://unpkg.com/vue@3.5.41/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <script>
      // Vue 3 replaces `new Vue({ el })` with createApp().mount().
      const { createApp } = Vue;

      createApp({
        template: '<div>{{ message }}</div>',
        data() {
          return { message: 'Hello Vue!' };
        },
      }).mount('#app');
    </script>
  </body>
</html>
